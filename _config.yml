title: LangChain Foundations — The Master Book
description: A plain-English, step-by-step companion to LangChain Academy's "Introduction to LangChain (Python)" course
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
mermaid:
  version: "10.9.1"
aux_links:
  "Course repo": "https://github.com/langchain-ai/lca-lc-foundations"
  "LangChain docs": "https://docs.langchain.com/oss/python/langchain/overview"
footer_content: "Unofficial study companion. Course content © LangChain, Inc. Code samples here are explanatory re-writes — always compare with the notebooks in the official repo."
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Watch out
    color: red
